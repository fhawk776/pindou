<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端关键设置：
     width=device-width 让布局宽度跟随屏幕，而不是按 980px 缩放后缩小显示。
     maximum-scale 不设限，允许用户双指放大查看细节。
     viewport-fit=cover 适配刘海屏。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B9D">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="请拼豆">
<title>请拼豆 · 会员管理系统（演示）</title>
<style>
/* ==========================================================================
   请拼豆 · 会员管理系统
   设计语言：拼豆（像素 + 圆润）+ 可爱风 + 粉色调
   参考门店海报：粉色主色、奶油底、胶囊标签、大圆角、爱心装饰
   ========================================================================== */

:root {
  /* 主色 —— 取自门店海报 */
  --pink:        #FF6B9D;
  --pink-deep:   #E84A7F;
  --pink-light:  #FFE4EC;
  --pink-pale:   #FFF5F8;

  /* 辅助色 */
  --cream:       #FFFBF7;
  --yellow:      #FFD93D;
  --yellow-light:#FFF8E1;
  --mint:        #6FD9C0;
  --mint-light:  #E6F9F4;
  --sky:         #7EC8F0;
  --coral:       #FF8A65;
  --coral-light: #FFEDE6;

  /* 中性色（不用纯黑，更柔和） */
  --text:        #4A3B42;
  --text-mid:    #8B7A82;
  --text-dim:    #B5A8AE;
  --border:      #F0E4E9;
  --bg:          #FFF9FB;
  --card:        #FFFFFF;

  --radius-lg:   20px;
  --radius:      14px;
  --radius-sm:   10px;
  --shadow:      0 2px 8px rgba(232, 74, 127, 0.07);
  --shadow-lg:   0 6px 20px rgba(232, 74, 127, 0.13);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

/* 背景点缀：柔和的拼豆圆点图案 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,107,157,.07) 0 6px, transparent 7px),
    radial-gradient(circle at 88% 32%, rgba(126,200,240,.07) 0 5px, transparent 6px),
    radial-gradient(circle at 25% 78%, rgba(255,217,61,.08) 0 5px, transparent 6px),
    radial-gradient(circle at 72% 88%, rgba(111,217,192,.07) 0 6px, transparent 7px);
  background-size: 220px 220px, 260px 260px, 200px 200px, 240px 240px;
}

/* ---------- 布局 ---------- */
.page {
  flex: 1; padding: 14px;
  padding-bottom: calc(80px + var(--safe-bottom));
  max-width: 780px; margin: 0 auto; width: 100%;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 249, 251, .94);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  max-width: 780px; margin: 0 auto; width: 100%;
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 700; flex: 1; letter-spacing: .3px; }
.topbar .back {
  background: none; border: none; font-size: 15px;
  color: var(--pink); cursor: pointer; padding: 4px 6px 4px 0; font-weight: 600;
}
.topbar .logo { font-size: 21px; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
  display: flex; padding-bottom: var(--safe-bottom);
}
.tabbar button {
  flex: 1; background: none; border: none;
  padding: 8px 0 10px; cursor: pointer;
  color: var(--text-dim); font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .15s;
}
.tabbar button.active { color: var(--pink); font-weight: 600; }
.tabbar .icon { font-size: 20px; line-height: 1; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
.card-title { font-size: 13px; color: var(--text-mid); margin: 0 0 8px; font-weight: 600; }

/* ---------- 顶部统计 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 14px; }
.stat {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 10px; box-shadow: var(--shadow); text-align: center;
}
.stat .value { font-size: 28px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
.stat .value.pink { color: var(--pink); }
.stat .value.mint { color: var(--mint); }
.stat .label { font-size: 12.5px; color: var(--text-mid); margin-top: 3px; }

/* ---------- 工位看板 ---------- */
/*
 * 移动优先的分栏策略：
 *   手机（含大屏手机）一律单列 —— 卡片横向空间充足，字号才看得清。
 *   平板起两列，桌面宽屏三列。
 * 早先的 480px 断点会让 500px 左右的机型挤成两列，
 * 每张卡片仅 220px 宽，桌名与倒计时被迫缩小，因此上调到 640px。
 */
.board-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .board-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .board-grid { grid-template-columns: repeat(3, 1fr); } }

.seat {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 15px; position: relative;
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
  transition: transform .12s, box-shadow .12s;
  min-height: 138px;
  display: flex; flex-direction: column;
}
.seat:active { transform: scale(.985); }

/* 使用中：粉色描边 */
.seat.occupied { border-color: var(--pink); background: linear-gradient(160deg, #fff 0%, var(--pink-pale) 100%); }

/* 即将到时：黄色呼吸提醒 */
.seat.warning { border-color: var(--yellow); background: linear-gradient(160deg, #fff 0%, var(--yellow-light) 100%); animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 2px 8px rgba(255,217,61,.2); }
  50%      { box-shadow: 0 4px 20px rgba(255,217,61,.6); }
}

/* 已超时：珊瑚红 */
.seat.overtime { border-color: var(--coral); background: linear-gradient(160deg, #fff 0%, var(--coral-light) 100%); }

/* 空闲：虚线边框 */
.seat.idle { border-style: dashed; border-color: #E8DCE2; background: #FFFDFE; cursor: pointer; }
.seat.idle:active { background: var(--pink-pale); }
.seat.maintenance { border-style: dashed; border-color: var(--text-dim); background: #FAFAFA; opacity: .7; }

.seat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seat-name { font-weight: 700; font-size: 16px; letter-spacing: .2px; }

/* 状态胶囊标签 */
.pill {
  font-size: 12px; padding: 4px 11px; border-radius: 999px;
  font-weight: 700; letter-spacing: .3px; white-space: nowrap;
}
.pill.busy { background: var(--pink); color: #fff; }
.pill.free { background: #EFE9ED; color: var(--text-mid); }
.pill.warn { background: var(--yellow); color: #6B4E00; }
.pill.over { background: var(--coral); color: #fff; }
.pill.paused { background: #FFF3CD; color: #8a6d00; border-color: #ffe08a; }

/* 暂停卡片 */
.pause-card { border-color: #ffe08a; background: #FFFDF5; }
.pause-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pause-title { font-size: 15px; font-weight: 700; color: var(--text); }
.pause-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.pause-row .btn { flex: 0 0 auto; }
.pill.card { background: var(--mint); color: #fff; }
.pill.fix  { background: #E5E5EA; color: var(--text-mid); }

.seat-person { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.seat-person .avatar { font-size: 17px; }

.seat-meta { font-size: 13px; color: var(--text-mid); margin-bottom: auto; }

/* 倒计时区块 */
.seat-timer {
  background: var(--pink-light); border-radius: var(--radius-sm);
  padding: 10px 12px; margin-top: 11px;
}
.seat.warning .seat-timer { background: var(--yellow-light); }
.seat.overtime .seat-timer { background: var(--coral-light); }

.seat-timer .label { font-size: 12.5px; color: var(--text-mid); margin-bottom: 2px; }
.seat-timer .time {
  font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1.2;
  /* 等宽数字：倒计时每秒变化时字宽保持一致，避免整行左右抖动 */
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  /* 固定行高，防止字体回退时高度跳动 */
  min-height: 29px;
}
.seat-timer .time.small { font-size: 17px; min-height: 22px; }
.seat.overtime .seat-timer .time { color: var(--coral); }
.seat.warning .seat-timer .time { color: #B8860B; }

/* 空闲工位的接待按钮 */
.seat-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--text-dim); font-size: 14px; font-weight: 600;
}
.seat-empty .plus {
  width: 46px; height: 46px; border-radius: 50%;
  border: 2px dashed var(--pink); color: var(--pink);
  display: flex; align-items: center; justify-content: center;
  font-size: 25px; font-weight: 400;
}

/* ---------- 会员卡片（列表页展开式，重点突出权益） ---------- */
.member-card {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 14px 15px; margin-bottom: 11px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: transform .12s, box-shadow .12s;
}
.member-card:active { transform: scale(.99); box-shadow: var(--shadow-lg); }

.mc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mc-name { font-size: 17px; font-weight: 700; }
.mc-no { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* 权益行：卡片上视觉权重最高的元素 */
.mc-benefit {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 14px; font-weight: 700;
  padding: 11px 13px; border-radius: var(--radius-sm);
}
.mc-benefit.valid {
  background: linear-gradient(135deg, var(--mint-light) 0%, #D8F5EC 100%);
  color: #0B6B4F; border-left: 3px solid var(--mint);
}
.mc-benefit.expired {
  background: #F4F1F3; color: var(--text-mid); border-left: 3px solid #CFC5CA;
}
.mc-benefit.none {
  background: #FAF7F9; color: var(--text-dim);
  font-weight: 500; font-size: 13px; border-left: 3px solid #E8E0E4;
}
.mc-left { font-size: 12px; font-weight: 600; opacity: .9; white-space: nowrap; }

/* 底部次要信息：加入日期、到店次数、用卡次数，用于区分重名会员 */
.mc-foot {
  margin-top: 9px; font-size: 12px; color: var(--text-dim);
  display: flex; justify-content: space-between; gap: 10px;
}

/* ---------- 加购列表（带数量） ---------- */
.addon-list { display: flex; flex-direction: column; gap: 9px; }

.addon-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 13px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); transition: all .15s;
}
.addon-row.selected { border-color: var(--pink); background: var(--pink-pale); }
.addon-row.multi { border-color: var(--pink); background: var(--pink-light); }

.addon-info { flex: 1; min-width: 0; }
.addon-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.addon-price { font-size: 12.5px; color: var(--text-mid); }
.addon-row.selected .addon-price { color: var(--pink-deep); font-weight: 600; }

/* 数量加减 */
.qty-ctrl { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.qty-btn {
  width: 34px; height: 34px; border-radius: 8px;
  border: 2px solid var(--pink-light); background: #fff;
  color: var(--pink); font-size: 20px; font-weight: 600; line-height: 1;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.qty-btn:active { background: var(--pink); color: #fff; border-color: var(--pink); }
.qty-num {
  min-width: 34px; text-align: center; font-size: 17px; font-weight: 800;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.addon-row.selected .qty-num { color: var(--pink); }

/* ---------- 超时收费预览 ---------- */
.ot-preview-box {
  background: var(--pink-pale); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 14px;
}
.ot-title { font-size: 12px; color: var(--text-mid); font-weight: 600; margin-bottom: 8px; }
.ot-row {
  display: flex; justify-content: space-between;
  font-size: 13px; padding: 3px 0; color: var(--text);
}
.ot-row span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--pink); }

/* ---------- 结算面板（核对账单 + 实收调整） ---------- */
.settle-dialog { max-height: 88vh; overflow-y: auto; }

.ov-box {
  background: var(--pink-pale); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 13.5px;
}
.ov-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px; padding: 4px 0; color: var(--text-mid);
}
.ov-row span:last-child { color: var(--text); font-weight: 600; }
.ov-row.discount span:last-child { color: var(--mint); }
.ov-row.extra span:last-child { color: var(--coral); }
.ov-row.total {
  border-top: 2px dashed rgba(232,74,127,.25);
  margin-top: 6px; padding-top: 10px;
  font-size: 16px; font-weight: 800; color: var(--text);
}
.ov-row.total span:last-child { color: var(--pink); font-size: 20px; }

.ov-diff { margin: -6px 0 12px; }
.ov-diff .ov-row {
  background: var(--pink-light); border-radius: var(--radius-sm);
  padding: 9px 13px; font-weight: 700;
}
.ov-diff .ov-row.discount { background: var(--mint-light); }
.ov-diff .ov-row.extra { background: var(--coral-light); }
.ov-diff .ov-row span:last-child { font-size: 16px; }

.ov-method {
  font-size: 12.5px; color: var(--text-dim);
  margin-bottom: 14px; text-align: center;
}

/* 支付方式选择（结算面板内） */
.pay-picker { display: flex; gap: 7px; flex-wrap: wrap; }
.pay-opt {
  flex: 1 1 0; min-width: 60px; padding: 12px 6px;
  border: 2px solid var(--border); background: #fff;
  border-radius: var(--radius-sm); font-family: inherit;
  font-size: 14px; font-weight: 600; color: var(--text-mid);
  cursor: pointer; transition: all .12s;
}
.pay-opt.on {
  border-color: var(--pink); background: var(--pink-pale);
  color: var(--pink); font-weight: 700;
}
.pay-opt:active { transform: scale(.97); }

/* 价目表：标题 + 新增按钮 */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.sec-head h2 { margin: 0; }

/* 删除危险区 */
.danger-zone {
  margin-top: 16px; padding: 12px 14px;
  border: 2px solid var(--coral-light, #f8d7da);
  border-radius: var(--radius-sm);
  background: #fff5f5;
}
.danger-zone.muted {
  border-color: var(--border); background: #fafafa;
}
.dz-title { font-size: 14px; font-weight: 700; color: var(--coral, #d44); margin-bottom: 4px; }
.danger-zone.muted .dz-title { color: var(--text-dim); }
.dz-note { font-size: 12.5px; color: var(--text-mid); line-height: 1.55; margin-bottom: 10px; }
.danger-zone .btn { margin-top: 4px; }

/* ---------- 价目表卡片式列表 ---------- */
.pl-group { margin-bottom: 20px; }
.pl-group-title {
  font-size: 14px; font-weight: 700; color: var(--text-mid);
  margin: 0 0 10px 2px;
}
.pl-grid { display: flex; flex-direction: column; gap: 10px; }

.pl-card {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .1s;
}
.pl-card:active { transform: scale(.99); }
.pl-card.off { opacity: .55; }

.pl-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.pl-cat {
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  letter-spacing: .5px;
}
.cat-timed { background: var(--sky); color: #fff; }
.cat-board { background: var(--coral); color: #fff; }
.cat-day   { background: var(--mint); color: #fff; }
.cat-card  { background: var(--yellow); color: #7a5b00; }
.cat-addon { background: var(--pink); color: #fff; }

.pl-price {
  font-size: 20px; font-weight: 800; color: var(--pink);
  font-variant-numeric: tabular-nums;
}
.pl-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.pl-spec { font-size: 12.5px; color: var(--text-mid); margin-bottom: 10px; }

.pl-foot { display: flex; justify-content: space-between; align-items: center; }
.pl-tags { display: flex; gap: 5px; }
.pl-tag {
  font-style: normal; font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 5px;
  background: var(--pink-pale); color: var(--pink-deep);
}
.pl-tag.off { background: var(--coral-light); color: var(--coral); }
.pl-edit {
  font-size: 12.5px; font-weight: 600; padding: 5px 13px;
  border: 1.5px solid var(--pink-light); border-radius: 8px;
  background: #fff; color: var(--pink-deep); cursor: pointer;
  font-family: inherit;
}
.pl-edit:active { background: var(--pink); color: #fff; border-color: var(--pink); }

/* ---------- 分类按钮组 ---------- */
.cat-group { display: flex; flex-wrap: wrap; gap: 7px; }
.cat-btn {
  flex: 1 1 30%; padding: 9px 4px; text-align: center;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: #fff; color: var(--text-mid);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .13s;
}
.cat-btn.on {
  border-color: var(--pink); background: var(--pink-pale);
  color: var(--pink-deep); font-weight: 700;
}
.cat-btn:active { transform: scale(.97); }

/* ---------- 规则开关 ---------- */
.rule-list { display: flex; flex-direction: column; gap: 8px; }
.rule-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 13px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color .13s;
}
.rule-info { flex: 1; min-width: 0; }
.rule-name { font-size: 14px; font-weight: 600; color: var(--text); }
.rule-desc { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

.switch {
  flex: 0 0 46px; height: 27px; border-radius: 14px;
  background: #e5e0e2; position: relative; transition: background .18s;
}
.switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 23px; height: 23px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: left .18s;
}
.switch.on { background: var(--pink); }
.switch.on::after { left: 21px; }

/* 输入框带单位后缀 */
.input-suffix { display: flex; align-items: center; gap: 8px; }
.input-suffix input { flex: 1; }
.input-suffix span { font-size: 13px; color: var(--text-mid); flex: 0 0 auto; }

/* 删除按钮通栏 + 不可删除提示 */
.btn.block { width: 100%; }
.dz-muted {
  font-size: 12.5px; color: var(--text-mid); line-height: 1.6;
  padding: 10px 13px; background: #fafafa;
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
  margin-bottom: 12px;
}

/* ---------- 列表 ---------- */
.list { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.list-item {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 15px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--pink-pale); }
.list-item .main { flex: 1; min-width: 0; }
.list-item .name { font-weight: 600; margin-bottom: 2px; font-size: 15px; }
.list-item .meta { font-size: 12px; color: var(--text-mid); }
.list-item .amount { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.list-item .amount.pos { color: var(--mint); }
.list-item .amount.neg { color: var(--coral); }

.empty { text-align: center; padding: 44px 16px; color: var(--text-dim); font-size: 14px; }
.empty .emoji { font-size: 40px; display: block; margin-bottom: 10px; opacity: .55; }

/* ---------- 表单 ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-mid); margin-bottom: 6px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 16px; background: #fff; color: var(--text);
  font-family: inherit; transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(255,107,157,.13);
}
.field .hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* ---------- 按钮 ---------- */
.btn {
  width: 100%; padding: 14px; border: none;
  border-radius: var(--radius-sm); font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  background: var(--pink); color: #fff;
  transition: transform .1s, opacity .15s;
  box-shadow: 0 3px 10px rgba(255,107,157,.28);
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.secondary { background: #F5EDF1; color: var(--text); box-shadow: none; }
.btn.mint { background: var(--mint); box-shadow: 0 3px 10px rgba(111,217,192,.3); }
.btn.danger { background: var(--coral); box-shadow: 0 3px 10px rgba(255,138,101,.3); }
.btn.ghost { background: none; color: var(--pink); border: 2px solid var(--pink-light); box-shadow: none; }
.btn.small { width: auto; padding: 8px 15px; font-size: 14px; }
.btn-group { display: flex; gap: 10px; }

/* ---------- 分段控件 ---------- */
.segmented {
  display: flex; background: #F5EDF1; border-radius: var(--radius-sm);
  padding: 3px; margin-bottom: 14px;
}
.segmented button {
  flex: 1; padding: 9px 4px; border: none; background: none;
  border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--text-mid); cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.segmented button.active { background: #fff; color: var(--pink); box-shadow: 0 1px 4px rgba(0,0,0,.07); }

/* ---------- 登录 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: linear-gradient(165deg, #FFF5F8 0%, #FFE4EC 55%, #FFF0F5 100%);
}
.login-box { width: 100%; max-width: 370px; }
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo .mark { font-size: 52px; line-height: 1; }
.login-logo h1 { font-size: 23px; margin: 12px 0 4px; font-weight: 800; color: var(--pink-deep); letter-spacing: 1px; }
.login-logo p { color: var(--text-mid); font-size: 13px; margin: 0; }

/* ---------- 会员卡头 ---------- */
.member-head {
  background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
  color: #fff; border-radius: var(--radius-lg); padding: 19px;
  margin-bottom: 12px; box-shadow: var(--shadow-lg);
  position: relative; overflow: hidden;
}
.member-head::after {
  content: '🧩'; position: absolute; right: -8px; bottom: -14px;
  font-size: 76px; opacity: .13; transform: rotate(-12deg);
}
.member-head .name { font-size: 21px; font-weight: 800; margin-bottom: 3px; }
.member-head .no { font-size: 12px; opacity: .85; margin-bottom: 14px; }
.member-head .figures { display: flex; gap: 22px; position: relative; z-index: 1; }
.member-head .fig .k { font-size: 11px; opacity: .82; }
.member-head .fig .v {
  font-size: 18px; font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* 卡权益徽章 */
.card-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.22); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
}
.card-badge.expired { background: rgba(0,0,0,.2); }
.card-badge.frozen {
  background: rgba(126, 200, 240, .38);
  border: 1px solid rgba(255,255,255,.5);
}

/* 已停用的会员：卡头整体压暗，一眼能看出来 */
.member-head.disabled {
  background: linear-gradient(135deg, #9B8A92 0%, #7A6A72 100%);
}

/* 会员状态行 */
.status-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.status-label { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.status-hint { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
.status-row .btn { flex: 0 0 auto; }

/* ---------- 办卡确认面板（替代浏览器 prompt） ---------- */
.card-dialog-mask {
  position: fixed; inset: 0; background: rgba(74, 59, 66, .42);
  z-index: 200; animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.card-dialog {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 420px;
  background: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 20px 18px calc(20px + var(--safe-bottom));
  z-index: 201; box-shadow: 0 -6px 30px rgba(0,0,0,.16);
  animation: slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp { from { transform: translate(-50%, 100%) } to { transform: translate(-50%, 0) } }

.cd-title { font-size: 13px; color: var(--text-mid); font-weight: 600; margin-bottom: 4px; }
.cd-product { font-size: 19px; font-weight: 800; }
.cd-price { font-size: 26px; font-weight: 800; color: var(--pink); margin: 2px 0 12px; font-variant-numeric: tabular-nums; }
.cd-info {
  font-size: 13px; color: var(--text-mid); line-height: 1.6;
  background: var(--pink-pale); border-radius: var(--radius-sm);
  padding: 11px 13px; margin-bottom: 16px;
}
.cd-label { font-size: 13px; color: var(--text-mid); font-weight: 600; margin-bottom: 8px; }
.cd-pay { display: flex; gap: 9px; margin-bottom: 12px; }
.cd-pay-btn {
  flex: 1; padding: 14px 8px; border: 2px solid var(--pink-light);
  background: #fff; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; color: var(--pink);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.cd-pay-btn:active { background: var(--pink); color: #fff; border-color: var(--pink); }
.cd-pay-btn:disabled { opacity: .45; }

/* 确认弹窗里的补充说明 */
.confirm-note {
  font-size: 12.5px; color: var(--text-dim); line-height: 1.55;
  margin-bottom: 14px;
}

/* 核对账单时的总金额，需要一眼看到 */
.confirm-total {
  font-size: 26px; font-weight: 800; color: var(--pink);
  text-align: center; letter-spacing: -.5px;
  font-variant-numeric: tabular-nums;
  padding: 12px 0 4px;
  border-top: 2px dashed var(--border);
  margin-top: 4px;
}

/* ---------- 提示条 ---------- */
.alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; font-weight: 500; }
.alert.error { background: #FFEDE9; color: #C0392B; }
.alert.warn  { background: var(--yellow-light); color: #8A6100; }
.alert.info  { background: #EAF4FE; color: #2C6BA8; }
.alert.success { background: var(--mint-light); color: #0E7C5A; }

/* ---------- 开单明细行 ---------- */
.item-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
.item-row .fields { flex: 1; display: grid; grid-template-columns: 1fr 58px 82px; gap: 6px; }
.item-row input { padding: 10px; font-size: 15px; border-width: 2px; }
.item-row .del {
  background: none; border: none; color: var(--coral);
  font-size: 21px; cursor: pointer; padding: 7px 3px; line-height: 1;
}

/* ---------- 汇总行 ---------- */
.summary-row {
  display: flex; justify-content: space-between; padding: 7px 0;
  font-size: 14px; color: var(--text-mid);
}
.summary-row .v { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.summary-row.total {
  border-top: 2px dashed var(--border); margin-top: 8px; padding-top: 12px;
  font-size: 19px; font-weight: 800; color: var(--text);
}
.summary-row.total .v { color: var(--pink); font-size: 22px; }

/* ---------- 套餐选择卡 ---------- */
/* 套餐选择：手机单列保证可读，平板起两列，桌面三列 */
.product-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .product-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
.product-card {
  background: #fff; border: 2px solid var(--border); border-radius: var(--radius);
  padding: 12px; cursor: pointer; text-align: center; transition: all .15s;
}
.product-card:active { transform: scale(.97); }
.product-card.selected { border-color: var(--pink); background: var(--pink-pale); box-shadow: 0 0 0 3px rgba(255,107,157,.1); }
.product-card .pname { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.product-card .pprice { font-size: 16px; font-weight: 800; color: var(--pink); font-variant-numeric: tabular-nums; }
.product-card .ptag { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

/* ---------- 加载 ---------- */
.loading { text-align: center; padding: 44px; color: var(--text-mid); }
.spinner {
  width: 28px; height: 28px; margin: 0 auto 11px;
  border: 3px solid var(--pink-light); border-top-color: var(--pink);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 平板 / 桌面 ---------- */
@media (min-width: 720px) {
  .page { padding: 20px; }
}


/* ---------- 演示模式专用样式 ---------- */
.demo-banner {
  position: fixed; right: 12px; bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  z-index: 150; background: rgba(74, 59, 66, .82); color: #fff;
  font-size: 11px; padding: 6px 12px; border-radius: 999px;
  backdrop-filter: blur(8px); pointer-events: none; letter-spacing: .3px;
}
@media (min-width: 720px) { .demo-banner { bottom: 16px; } }

.demo-toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  background: #4A3B42; color: #fff; font-size: 12px;
  padding: 8px 16px; border-radius: 999px; z-index: 160;
  max-width: 88vw; text-align: center; opacity: .95;
}
</style>

<script>
/* =========================================================================
   演示模式的数据层（离线单文件版）

   作用：拦截 fetch，把后端接口替换为内存中的真实数据快照。
   前端代码无需任何改动即可完整运行；所有写操作只在内存生效，
   刷新页面即恢复到快照状态。

   注意：本文件会被构建脚本原样内联进 HTML，因此不要在此处使用
   任何需要转义的写法，避免构建时被加工。
   ========================================================================= */
(function () {
  var snapshot = JSON.parse(document.getElementById('demo-data').textContent);
  var DB = JSON.parse(JSON.stringify(snapshot));

  /*
   * 时间平移策略
   * ─────────────────────────────────────────────────────────────
   * 快照是在导出那一刻抓取的，字段都是绝对时间。直接使用会有两个问题：
   *   1. 打开演示时倒计时早已走完，全部显示"已超时几百分钟"
   *   2. 但若简单地把开始时间统一改成"刚才"，又会抹掉"已超时 40 分钟"
   *      这种刻意构造的演示场景
   *
   * 因此对每个会话单独处理：
   *   · 限时套餐 —— 保留它相对现在的剩余/超时分钟数，只把绝对时间平移到今天
   *   · 用卡会话 —— 同样平移开始时间
   *   · 结束时间按平移后的开始时间重新推算
   */
  var DEMO_BASE = Date.now();

  /** 快照的抓取时刻，用于计算每个会话"距今已进行多久" */
  var snapshotAt = new Date(snapshot.board.serverTime).getTime();

  function shiftSessionKeepRelative(s) {
    var out = JSON.parse(JSON.stringify(s));

    // 原始记录里该会话距今多少分钟（用导出时刻做基准）
    var origStart = new Date(s.startedAt).getTime();
    var elapsedMin = Math.round((snapshotAt - origStart) / 60000);

    // 新的开始时间 = 现在 - 相同的已进行时长
    var newStart = DEMO_BASE - elapsedMin * 60000;
    out.startedAt = new Date(newStart).toISOString();

    if (s.expectedEndAt) {
      var origEnd = new Date(s.expectedEndAt).getTime();
      var totalMin = Math.round((origEnd - origStart) / 60000);
      out.expectedEndAt = new Date(newStart + totalMin * 60000).toISOString();
    } else {
      out.expectedEndAt = null;
    }

    out.elapsedMinutes = elapsedMin;
    out.remainingMinutes = out.expectedEndAt
      ? Math.round((new Date(out.expectedEndAt).getTime() - DEMO_BASE) / 60000)
      : null;
    return out;
  }

  // 启动时对快照中的会话做时间平移
  DB.board.tables.forEach(function (t) {
    if (t.session) t.session = shiftSessionKeepRelative(t.session);
  });
  // 历史记录的时间只需整体平移，不涉及倒计时
  (function shiftHistory() {
    var delta = DEMO_BASE - snapshotAt;
    function shift(iso) {
      if (!iso) return iso;
      return new Date(new Date(iso).getTime() + delta).toISOString();
    }
    DB.memberDetails.forEach(function (m) {
      (m.visits || []).forEach(function (v) {
        v.startedAt = shift(v.startedAt);
        v.endedAt = shift(v.endedAt);
      });
      (m.orders || []).forEach(function (o) { o.completedAt = shift(o.completedAt); });
    });
    DB.orders.orders.forEach(function (o) { o.completedAt = shift(o.completedAt); });
    DB.ledger.entries.forEach(function (e) { e.createdAt = shift(e.createdAt); });
  })();

  function ok(body) {
    return Promise.resolve(new Response(JSON.stringify(body), {
      status: 200,
      headers: { 'Content-Type': 'application/json' },
    }));
  }

  function fail(message, status) {
    return Promise.resolve(new Response(
      JSON.stringify({ error: { code: 'DEMO', message: message } }),
      { status: status || 400, headers: { 'Content-Type': 'application/json' } }
    ));
  }

  /* 把开台记录组装成看板需要的结构 */
  function buildBoard() {
    var pricing = (DB.settings && DB.settings.pricing) || {};
    var tables = DB.tables.tables.map(function (t) {
      var hit = null;
      DB.board.tables.forEach(function (x) {
        if (x.tableId === t.id) hit = x;
      });
      if (hit && hit.session) return JSON.parse(JSON.stringify(hit));
      return { tableId: t.id, tableName: t.name, capacity: t.capacity, status: 'idle', session: null };
    });

    var occupied = 0;
    tables.forEach(function (x) { if (x.status === 'occupied') occupied++; });

    return {
      summary: {
        total: tables.length,
        occupied: occupied,
        idle: tables.length - occupied,
        maintenance: 0,
      },
      tables: tables,
      pricing: pricing,
      serverTime: new Date().toISOString(),
    };
  }

  function todayStamp() {
    var d = new Date();
    return '' + d.getFullYear()
      + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0');
  }

  function matchId(url, prefix, suffix) {
    if (url.indexOf(prefix) !== 0) return null;
    var rest = url.slice(prefix.length);
    if (suffix) {
      if (rest.slice(-suffix.length) !== suffix) return null;
      rest = rest.slice(0, -suffix.length);
    }
    if (!/^[0-9]+$/.test(rest)) return null;
    return parseInt(rest, 10);
  }

  function findAllSession(sessionId) {
    var found = null;
    DB.board.tables.forEach(function (t) {
      if (t.session && t.session.sessionId === sessionId) found = t;
    });
    return found;
  }

  function handle(method, path, body) {
    var qi = path.indexOf('?');
    var url = qi >= 0 ? path.slice(0, qi) : path;
    var query = {};
    if (qi >= 0) {
      path.slice(qi + 1).split('&').forEach(function (kv) {
        var eq = kv.indexOf('=');
        var k = eq >= 0 ? kv.slice(0, eq) : kv;
        var v = eq >= 0 ? kv.slice(eq + 1) : '';
        query[decodeURIComponent(k)] = decodeURIComponent(v);
      });
    }

    /* ---------- 认证 ---------- */
    if (url === '/api/v1/auth/me') {
      return ok({ user: { id: 1, username: 'admin', displayName: '店主', role: 'admin' } });
    }
    if (url === '/api/v1/auth/login') {
      return ok({ user: { id: 1, username: 'admin', displayName: '店主', role: 'admin' } });
    }
    if (url === '/api/v1/auth/logout') return ok({ ok: true });

    /* ---------- 看板与基础数据 ---------- */
    if (url === '/api/v1/board') return ok(buildBoard());
    if (url === '/api/v1/tables') return ok(DB.tables);

    if (url === '/api/v1/products') {
      // 与后端一致：
      //   · 默认只返回在售套餐（开台/结账用）
      //   · includeInactive=true 时连停用的一起返回（设置页用）
      // 少了这个过滤，已下架的套餐仍会出现在开台页，
      // 店员点下去就会撞上"套餐不存在"。
      var showAll = query.includeInactive === 'true';
      var list = DB.products.products.filter(function (p) {
        return showAll || p.isActive !== false;
      });
      if (query.category) {
        list = list.filter(function (p) { return p.category === query.category; });
      }
      return ok({ products: list });
    }

    // 新增套餐：写入内存快照，让演示里的增删改真正生效
    if (url === '/api/v1/products' && method === 'POST') {
      var maxId = 0;
      DB.products.products.forEach(function (p) { if (p.id > maxId) maxId = p.id; });
      var np = {
        id: maxId + 1,
        code: body.code || ('P' + Date.now().toString(36).toUpperCase()),
        name: body.name, category: body.category,
        priceCents: body.priceCents,
        durationMinutes: body.durationMinutes || null,
        pins: body.pins || null,
        peopleCount: body.peopleCount || 1,
        cardValidDays: body.cardValidDays || null,
        cardType: body.cardType || null,
        discountable: body.discountable !== false,
        overtimeApplicable: body.overtimeApplicable === true,
        sortOrder: body.sortOrder || 50,
        isActive: body.isActive !== false,
      };
      DB.products.products.push(np);
      return ok({ id: np.id });
    }

    // 查某个套餐能否删除（演示里都视为未使用）
    var prodUsageId = matchId(url, '/api/v1/products/', '/usage');
    if (prodUsageId !== null) {
      return ok({ orderCount: 0, sessionCount: 0, canDelete: true });
    }

    // 修改套餐
    var prodEditId = matchId(url, '/api/v1/products/');
    if (prodEditId !== null && method === 'PATCH') {
      var prod = null;
      DB.products.products.forEach(function (p) { if (p.id === prodEditId) prod = p; });
      if (!prod) return fail('套餐不存在', 404);
      if (body.name !== undefined) prod.name = body.name;
      if (body.priceCents !== undefined) prod.priceCents = body.priceCents;
      if (body.durationMinutes !== undefined) prod.durationMinutes = body.durationMinutes;
      if (body.pins !== undefined) prod.pins = body.pins;
      if (body.peopleCount !== undefined) prod.peopleCount = body.peopleCount;
      if (body.cardValidDays !== undefined) prod.cardValidDays = body.cardValidDays;
      if (body.cardType !== undefined) prod.cardType = body.cardType;
      if (body.discountable !== undefined) prod.discountable = body.discountable;
      if (body.overtimeApplicable !== undefined) prod.overtimeApplicable = body.overtimeApplicable;
      if (body.isActive !== undefined) prod.isActive = body.isActive;
      if (body.sortOrder !== undefined) prod.sortOrder = body.sortOrder;
      return ok({ ok: true });
    }

    // 删除套餐
    if (prodEditId !== null && method === 'DELETE') {
      var di = -1;
      DB.products.products.forEach(function (p, i) { if (p.id === prodEditId) di = i; });
      if (di < 0) return fail('套餐不存在', 404);
      DB.products.products.splice(di, 1);
      return ok({ ok: true, deleted: true });
    }

    /* ---------- 会员 ---------- */
    if (url === '/api/v1/members') {
      var ms = DB.members.members.slice();
      if (query.q) {
        var q = query.q.toLowerCase();
        ms = ms.filter(function (m) {
          var nick = (m.nickname || '').toLowerCase();
          var tail = m.phoneTail || '';
          var no = (m.memberNo || '').toLowerCase();
          return nick.indexOf(q) >= 0 || tail.indexOf(q) >= 0 || no.indexOf(q) >= 0;
        });
      }
      return ok({ members: ms.slice(0, parseInt(query.limit, 10) || 50) });
    }

    if (url === '/api/v1/members/reminders') {
      var out = [];
      DB.members.members.forEach(function (m) {
        if (!m.cardValid) return;
        var left = Math.round((new Date(m.cardExpiresAt) - new Date()) / 86400000);
        if (left >= 0 && left <= 7) {
          out.push({
            id: m.id, memberNo: m.memberNo, nickname: m.nickname, phoneTail: m.phoneTail,
            displayName: m.displayName, cardType: m.cardType,
            cardExpiresAt: m.cardExpiresAt, daysLeft: left,
          });
        }
      });
      return ok({ reminders: out });
    }

    var mid = matchId(url, '/api/v1/members/');
    if (mid !== null) {
      var found = null;
      DB.memberDetails.forEach(function (m) { if (m.id === mid) found = m; });
      if (!found) {
        DB.members.members.forEach(function (m) { if (m.id === mid) found = m; });
      }
      if (!found) return fail('会员不存在', 404);
      return ok({ member: found });
    }

    var recId = matchId(url, '/api/v1/members/', '/card-records');
    if (recId !== null) {
      return ok({ records: DB.cardRecords[String(recId)] || [] });
    }

    var ledId = matchId(url, '/api/v1/members/', '/ledger');
    if (ledId !== null) {
      var md = null;
      DB.memberDetails.forEach(function (m) { if (m.id === ledId) md = m; });
      var type = query.type || 'visits';
      if (type === 'orders') {
        var os = (md && md.orders) || [];
        return ok({ entries: os.map(function (o) {
          return {
            id: o.id, orderNo: o.orderNo, status: o.status,
            totalCents: o.totalCents, paidBalanceCents: 0, paidCashCents: o.paidCents,
            pointsEarned: 0, completedAt: o.completedAt, operatorName: '店主',
          };
        }) });
      }
      if (type === 'recharges' || type === 'balance') return ok({ entries: [] });
      return ok({ entries: [] });
    }

    /* ---------- 开台 ---------- */
    if (url === '/api/v1/sessions' && method === 'POST') {
      var table = null;
      DB.tables.tables.forEach(function (t) { if (t.id === body.tableId) table = t; });
      if (!table) return fail('桌位不存在', 404);

      var prod = null;
      DB.products.products.forEach(function (p) { if (p.id === body.productId) prod = p; });
      if (!prod) return fail('套餐不存在', 404);

      var slot = null;
      DB.board.tables.forEach(function (x) { if (x.tableId === body.tableId) slot = x; });
      if (slot && slot.session) return fail(table.name + ' 正在使用中');

      var member = null;
      if (body.memberId) {
        DB.members.members.forEach(function (m) { if (m.id === body.memberId) member = m; });
      }

      var now = new Date();
      var endAt = prod.durationMinutes
        ? new Date(now.getTime() + prod.durationMinutes * 60000)
        : null;

      var newSession = {
        sessionId: Date.now(),
        memberId: member ? member.id : null,
        memberNo: member ? member.memberNo : null,
        displayName: member ? member.displayName : (body.guestName || '散客'),
        phoneTail: member ? member.phoneTail : null,
        productName: prod.name,
        category: prod.category,
        startedAt: now.toISOString(),
        expectedEndAt: endAt ? endAt.toISOString() : null,
        remainingMinutes: prod.durationMinutes || null,
        elapsedMinutes: 0,
        usedCard: !!body.useCard,
        cardType: member ? member.cardType : null,
        cardExpiresAt: member ? member.cardExpiresAt : null,
        alertLevel: 'normal',
      };

      if (slot) {
        slot.status = 'occupied';
        slot.session = newSession;
      } else {
        DB.board.tables.push({
          tableId: body.tableId, tableName: table.name, capacity: table.capacity,
          status: 'occupied', session: newSession,
        });
      }

      return ok({
        sessionId: newSession.sessionId, tableName: table.name, productName: prod.name,
        startedAt: newSession.startedAt, expectedEndAt: newSession.expectedEndAt,
        useCard: !!body.useCard,
      });
    }

    var sessId = matchId(url, '/api/v1/sessions/');
    if (sessId !== null && method === 'GET') {
      var hit = findAllSession(sessId);
      if (!hit) return fail('开台记录不存在', 404);
      var s = Object.assign({
        tableId: hit.tableId, tableName: hit.tableName,
        productId: 1, productPriceCents: 0, status: 'active',
      }, hit.session);
      return ok({ session: s });
    }

    // 暂停计时（内存态：标记 paused，倒计时冻结）
    var pauseId = matchId(url, '/api/v1/sessions/', '/pause');
    if (pauseId !== null && method === 'POST') {
      var hitP = findAllSession(pauseId);
      if (!hitP) return fail('开台记录不存在', 404);
      if (hitP.session.paused) return fail('无法暂停：已经处于暂停中', 400);
      hitP.session.paused = true;
      hitP.session.pausedAt = new Date().toISOString();
      return ok({ pausedAt: hitP.session.pausedAt });
    }

    // 恢复计时（把暂停时长折算进 startedAt / expectedEndAt）
    var resumeId = matchId(url, '/api/v1/sessions/', '/resume');
    if (resumeId !== null && method === 'POST') {
      var hitR = findAllSession(resumeId);
      if (!hitR) return fail('开台记录不存在', 404);
      if (!hitR.session.paused) return fail('无法恢复：并未处于暂停', 400);
      var pausedAtMs = new Date(hitR.session.pausedAt).getTime();
      var delta = Date.now() - pausedAtMs;
      hitR.session.startedAt = new Date(new Date(hitR.session.startedAt).getTime() + delta).toISOString();
      if (hitR.session.expectedEndAt) {
        hitR.session.expectedEndAt = new Date(new Date(hitR.session.expectedEndAt).getTime() + delta).toISOString();
      }
      hitR.session.paused = false;
      hitR.session.pausedAt = null;
      return ok({ startedAt: hitR.session.startedAt, expectedEndAt: hitR.session.expectedEndAt });
    }

    var prevId = matchId(url, '/api/v1/sessions/', '/preview');
    if (prevId !== null) {
      var hit2 = findAllSession(prevId);
      if (!hit2) return fail('开台记录不存在', 404);
      var ss = hit2.session;

      var prod2 = { priceCents: 0, discountable: true };
      DB.products.products.forEach(function (p) { if (p.name === ss.productName) prod2 = p; });

      // 必须用 floor：round 会让超时费提前 30 秒触发（与后端 elapsedMinutes 一致）
      var elapsed = Math.max(0, Math.floor((Date.now() - new Date(ss.startedAt)) / 60000));

      /*
       * 超时费：阶梯式，与后端 calcOvertimeFee 保持一致。
       *   超时 1–baseMin 分钟        → baseFee
       *   之后每满 stepMin 分钟      → 加收 stepFee（不足一段按一段算）
       * 规则来自 settings.pricing，可在设置页调整。
       */
      var cfg = (DB.settings && DB.settings.pricing) || {};
      var baseMin = cfg.overtime_base_minutes != null ? cfg.overtime_base_minutes : 20;
      var baseFee = cfg.overtime_base_fee_cents != null ? cfg.overtime_base_fee_cents : 500;
      var stepMin = cfg.overtime_step_minutes != null ? cfg.overtime_step_minutes : 10;
      var stepFee = cfg.overtime_step_fee_cents != null ? cfg.overtime_step_fee_cents : 188;
      var roundUp = cfg.overtime_round_up !== false;

      var overtimeMinutes = 0;
      var overtimeUnits = 0;
      var overtimeFee = 0;
      if (!ss.usedCard && prod2.overtimeApplicable) {
        var productMinutes = prod2.durationMinutes || null;
        if (productMinutes && elapsed > productMinutes) {
          overtimeMinutes = elapsed - productMinutes;
          overtimeFee = baseFee;
          var beyond = overtimeMinutes - baseMin;
          if (beyond > 0) {
            overtimeUnits = roundUp ? Math.ceil(beyond / stepMin) : Math.floor(beyond / stepMin);
            overtimeFee += overtimeUnits * stepFee;
          }
        }
      }

      // 加购：解析 "id:qty"，与后端 resolveAddons 行为一致 ——
      // 不存在的项、已下架的项、数量超限一律报错，不静默忽略。
      // 静默忽略会让预览价低于结账价，是"看着便宜、收着贵"的温床。
      var addonCents = 0;
      var addonDiscountable = 0;
      if (query.addons) {
        var qtyMap = {};
        var badMsg = null;

        query.addons.split(',').forEach(function (raw) {
          if (badMsg) return;
          var seg = raw.split(':');
          var aid = parseInt(seg[0], 10);
          var qty = seg.length > 1 ? parseInt(seg[1], 10) : 1;
          if (!(qty > 0)) return;
          qtyMap[aid] = (qtyMap[aid] || 0) + qty;
        });

        Object.keys(qtyMap).forEach(function (k) {
          if (badMsg) return;
          var aid = parseInt(k, 10);
          var qty = qtyMap[k];
          var prod = null;
          DB.products.products.forEach(function (x) { if (x.id === aid) prod = x; });

          if (!prod) { badMsg = '部分加购项不存在，请重新选择'; return; }
          if (prod.category !== 'addon') { badMsg = '「' + prod.name + '」不是加购项'; return; }
          if (prod.isActive === false) { badMsg = '加购项「' + prod.name + '」已下架，请重新选择'; return; }
          if (qty > 99) { badMsg = '加购项「' + prod.name + '」数量超出上限（最多 99 件）'; return; }

          var line = prod.priceCents * qty;
          addonCents += line;
          if (prod.discountable !== false) addonDiscountable += line;
        });

        if (badMsg) return fail(badMsg, 400);
      }

      var day = new Date().getDate();
      var discountDays = cfg.discount_days || [8, 18, 28];
      var rateBp = cfg.discount_rate_bp != null ? cfg.discount_rate_bp : 8000;

      var canDiscountProduct = discountDays.indexOf(day) >= 0
        && prod2.discountable !== false && !ss.usedCard;
      var discountedProduct = ss.usedCard
        ? 0
        : (canDiscountProduct ? Math.floor(prod2.priceCents * rateBp / 10000) : prod2.priceCents);
      var productDiscountCents = (ss.usedCard ? 0 : prod2.priceCents) - discountedProduct;

      var canDiscountAddon = discountDays.indexOf(day) >= 0 && addonDiscountable > 0;
      var discountedAddon = canDiscountAddon
        ? Math.floor(addonCents * rateBp / 10000)
        : addonCents;
      var addonDiscountCents = addonCents - discountedAddon;

      var discountCents = productDiscountCents + addonDiscountCents;
      var isDiscountDay = canDiscountProduct || canDiscountAddon;
      var total = Math.max(0, discountedProduct + discountedAddon + overtimeFee);

      return ok({ preview: {
        productAmountCents: discountedProduct,
        productOriginalCents: ss.usedCard ? 0 : prod2.priceCents,
        discountCents: discountCents,
        isDiscountDay: isDiscountDay,
        discountRateBp: isDiscountDay ? rateBp : null,
        addonAmountCents: discountedAddon,
        addonOriginalCents: addonCents,
        addonDiscountCents: addonDiscountCents,
        overtimeUnits: overtimeUnits,
        overtimeMinutes: overtimeMinutes,
        overtimeFeeCents: overtimeFee,
        totalCents: total,
        actualMinutes: elapsed,
        usedCard: ss.usedCard,
      } });
    }

    var settleId = matchId(url, '/api/v1/sessions/', '/settle');
    if (settleId !== null && method === 'POST') {
      var hit3 = findAllSession(settleId);
      if (!hit3) return fail('开台记录不存在', 404);

      // 复算一遍金额，让演示里的结账结果与预览一致。
      // 若前端传了实收调整（overrideTotalCents），以它为准 ——
      // 这与后端语义相同：差额记成一笔人工优惠。
      var ss3 = hit3.session;
      var prod3 = { priceCents: 0, discountable: true };
      DB.products.products.forEach(function (p) { if (p.name === ss3.productName) prod3 = p; });

      var elapsed3 = Math.max(0, Math.floor((Date.now() - new Date(ss3.startedAt)) / 60000));
      var cfg3 = (DB.settings && DB.settings.pricing) || {};
      var otFee3 = 0, otUnits3 = 0;
      if (!ss3.usedCard && prod3.overtimeApplicable && prod3.durationMinutes
          && elapsed3 > prod3.durationMinutes) {
        var over3 = elapsed3 - prod3.durationMinutes;
        var bMin = cfg3.overtime_base_minutes != null ? cfg3.overtime_base_minutes : 20;
        var bFee = cfg3.overtime_base_fee_cents != null ? cfg3.overtime_base_fee_cents : 500;
        var sMin = cfg3.overtime_step_minutes != null ? cfg3.overtime_step_minutes : 10;
        var sFee = cfg3.overtime_step_fee_cents != null ? cfg3.overtime_step_fee_cents : 188;
        var rUp = cfg3.overtime_round_up !== false;
        otFee3 = bFee;
        var beyond3 = over3 - bMin;
        if (beyond3 > 0) {
          otUnits3 = rUp ? Math.ceil(beyond3 / sMin) : Math.floor(beyond3 / sMin);
          otFee3 += otUnits3 * sFee;
        }
      }

      // 与预览共用同一套校验，保证两个接口结论一致
      var addonSum3 = 0;
      var addonQty3 = {};
      var bad3 = null;
      (body.addonItems || []).forEach(function (it) {
        addonQty3[it.id] = (addonQty3[it.id] || 0) + it.qty;
      });
      Object.keys(addonQty3).forEach(function (k) {
        if (bad3) return;
        var aid = parseInt(k, 10);
        var qty = addonQty3[k];
        var prod = null;
        DB.products.products.forEach(function (x) { if (x.id === aid) prod = x; });

        if (!prod) { bad3 = '部分加购项不存在，请重新选择'; return; }
        if (prod.category !== 'addon') { bad3 = '「' + prod.name + '」不是加购项'; return; }
        if (prod.isActive === false) { bad3 = '加购项「' + prod.name + '」已下架，请重新选择'; return; }
        if (qty > 99) { bad3 = '加购项「' + prod.name + '」数量超出上限（最多 99 件）'; return; }

        addonSum3 += prod.priceCents * qty;
      });
      if (bad3) return fail(bad3, 400);

      var days3 = cfg3.discount_days || [8, 18, 28];
      var rate3 = cfg3.discount_rate_bp != null ? cfg3.discount_rate_bp : 8000;
      var isDD3 = days3.indexOf(new Date().getDate()) >= 0;
      var prodPaid3 = ss3.usedCard ? 0
        : (isDD3 && prod3.discountable !== false
            ? Math.floor(prod3.priceCents * rate3 / 10000) : prod3.priceCents);
      var addonPaid3 = isDD3 ? Math.floor(addonSum3 * rate3 / 10000) : addonSum3;

      var computed3 = prodPaid3 + addonPaid3 + otFee3;
      var paid3 = (body.overrideTotalCents !== undefined && body.overrideTotalCents !== null)
        ? body.overrideTotalCents
        : computed3;

      hit3.status = 'idle';
      hit3.session = null;
      hit3.tableId = hit3.tableId;

      // 结账后把这一笔加进收入流水，让"收入"页能看到刚结的账
      var flowNo3 = 'F' + todayStamp() + String(DB.ledger.entries.length + 1).padStart(4, '0');
      if (paid3 > 0) {
        DB.ledger.entries.unshift({
          id: DB.ledger.entries.length + 1,
          flowNo: flowNo3,
          orderNo: 'O' + todayStamp() + String(DB.orders.orders.length + 1).padStart(4, '0'),
          memberName: ss3.displayName || '散客',
          tableName: hit3.tableName,
          amountCents: paid3,
          paymentMethod: body.paymentMethod || 'wechat',
          createdAt: new Date().toISOString(),
          note: body.note || (body.overrideReason ? '实收调整：' + body.overrideReason : ''),
        });
      }

      // 折扣与人工调整分列返回，与后端 settleSession 保持一致：
      //   discountCents      只含打折日优惠（恒 >= 0）
      //   manualAdjustCents  人工调整 = 应收 - 实收，正数少收、负数多收
      // 混在一起会让前端把"熟人优惠"显示成"打折日优惠"。
      var autoDiscount3 = (ss3.usedCard ? 0 : prod3.priceCents - prodPaid3)
                        + (addonSum3 - addonPaid3);
      var manualAdjust3 = computed3 - paid3;

      return ok({
        orderId: Date.now(),
        orderNo: 'O' + todayStamp() + String(DB.orders.orders.length + 1).padStart(4, '0'),
        flowNo: flowNo3,
        totalCents: paid3, paidCents: paid3,
        productAmountCents: prodPaid3, addonAmountCents: addonPaid3,
        overtimeFeeCents: otFee3,
        discountCents: autoDiscount3,
        manualAdjustCents: manualAdjust3,
        actualMinutes: elapsed3, overtimeUnits: otUnits3,
        isDiscountDay: isDD3, usedCard: ss3.usedCard,
      });
    }

    var changeId = matchId(url, '/api/v1/sessions/', '/product');
    if (changeId !== null && method === 'PATCH') {
      var hit4 = findAllSession(changeId);
      if (!hit4) return fail('开台记录不存在', 404);
      var np = null;
      DB.products.products.forEach(function (p) { if (p.id === body.productId) np = p; });
      if (!np) return fail('套餐不存在', 404);
      hit4.session.productName = np.name;
      if (np.durationMinutes) {
        var s0 = new Date(hit4.session.startedAt).getTime();
        hit4.session.expectedEndAt = new Date(s0 + np.durationMinutes * 60000).toISOString();
      }
      return ok({ productName: np.name, expectedEndAt: hit4.session.expectedEndAt });
    }

    /* ---------- 收入 ---------- */
    if (url === '/api/v1/revenue/summary') return ok(DB.summary);
    if (url === '/api/v1/revenue/ledger') return ok(DB.ledger);
    if (url === '/api/v1/revenue/reconcile') {
      return ok({ consumeLedgerCents: 0, consumeOrdersCents: 0, consumeDiffCents: 0,
                  cardLedgerCents: 0, cardRecordsCents: 0, cardDiffCents: 0,
                  ledgerTotalCents: 0, diffCents: 0, balanced: true });
    }
    if (url === '/api/v1/orders') return ok(DB.orders);

    var oid = matchId(url, '/api/v1/orders/');
    if (oid !== null) {
      var od = null;
      DB.orders.orders.forEach(function (o) { if (o.id === oid) od = o; });
      if (!od) return fail('订单不存在', 404);
      return ok({ order: Object.assign({}, od, {
        items: [{ id: 1, name: od.tableName || '消费', category: 'timed', qty: 1,
                  unitPriceCents: od.totalCents, amountCents: od.totalCents }],
        refunds: [], flows: [],
        subtotalCents: od.totalCents, discountCents: 0, pointsDeductCents: 0,
        paidOtherCents: 0, pointsEarned: 0, pointsRedeemed: 0,
        operatorName: '店主', startedAt: od.completedAt, endedAt: od.completedAt,
      }) });
    }

    /* ---------- 设置与日志 ---------- */
    if (url === '/api/v1/settings') return ok({ settings: DB.settings });
    if (url === '/api/v1/levels') return ok({ levels: [] });
    if (url === '/api/v1/audit-logs') return ok({ logs: [] });

    return fail('演示版不支持该操作，数据为快照', 501);
  }

  /* ---- 拦截 fetch ---- */
  var realFetch = window.fetch;
  window.fetch = function (input, init) {
    var raw = typeof input === 'string' ? input : input.url;
    if (raw.indexOf('/api/v1/') < 0) return realFetch.apply(window, arguments);

    var method = (init && init.method) || 'GET';
    var path = raw.replace(/^[a-z]+:\/\/[^/]+/i, '');
    var body = null;
    if (init && init.body) {
      try { body = JSON.parse(init.body); } catch (e) { body = null; }
    }
    return handle(method, path, body);
  };

  /* ---- 顶部提示，说明这是演示 ---- */
  window.addEventListener('DOMContentLoaded', function () {
    var tip = document.createElement('div');
    tip.className = 'demo-toast';
    tip.textContent = '界面演示 · 数据为真实快照，可自由点击查看';
    document.body.appendChild(tip);
    setTimeout(function () {
      tip.style.transition = 'opacity .6s';
      tip.style.opacity = '0';
    }, 4200);
    setTimeout(function () { tip.remove(); }, 5000);
  });
})();

</script>

<script>
/* ==========================================================================
   请拼豆 · 会员管理系统 · 前端
   原生 JS，无构建步骤：产物极小、加载快、零常驻内存。
   金额一律用整数分传输，只在展示时转成元。
   ========================================================================== */
'use strict';

// ---------------------------------------------------------------------------
// 工具
// ---------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);

function yuan(cents) {
  if (cents === null || cents === undefined) return '0.00';
  const neg = cents < 0, abs = Math.abs(cents);
  return (neg ? '-' : '') + Math.floor(abs / 100) + '.' + String(abs % 100).padStart(2, '0');
}

/** 元 → 分，字符串解析避免浮点误差 */
function toCents(str) {
  const s = String(str ?? '').trim();
  if (s === '') return 0;
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  const [i, d = ''] = s.split('.');
  return parseInt(i, 10) * 100 + parseInt(d.padEnd(2, '0') || '0', 10);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (d.toDateString() === now.toDateString()) return hm;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}

function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = String(s).slice(0, 10).split('-');
  return `${Number(m)}月${Number(d)}日`;
}

/** 把分钟数说成人话 */
function humanMinutes(min) {
  if (min === null || min === undefined) return '—';
  const neg = min < 0, abs = Math.abs(min);
  const h = Math.floor(abs / 60), m = abs % 60;
  const txt = h > 0 ? (m > 0 ? `${h}小时${m}分` : `${h}小时`) : `${m}分钟`;
  return (neg ? '超时 ' : '') + txt;
}

// ---------------------------------------------------------------------------
// API
// ---------------------------------------------------------------------------
const api = {
  async request(method, path, body) {
    const opts = { method, headers: {}, credentials: 'same-origin' };
    // 只有确实要发 body 时才带 Content-Type。
    // Fastify 见到 application/json 就要求 body 非空，
    // DELETE 这类无 body 请求带上它会直接被拒（400 EMPTY_JSON_BODY）。
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch { /* 空响应 */ }
    if (!res.ok) {
      const err = new Error(data?.error?.message || `请求失败（${res.status}）`);
      err.status = res.status;
      throw err;
    }
    return data;
  },
  get: (p) => api.request('GET', p),
  post: (p, b) => api.request('POST', p, b),
  patch: (p, b) => api.request('PATCH', p, b),
  put: (p, b) => api.request('PUT', p, b),
  del: (p) => api.request('DELETE', p),
};

// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
const state = {
  user: null,
  route: { name: 'board', params: {} },
  toast: null,
  boardTimer: null,
  clockTimer: null,
};

function go(name, params = {}) {
  state.route = { name, params };
  window.scrollTo(0, 0);
  render();
}

function toast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { state.toast = null; render(); }, 2600);
}

// ---------------------------------------------------------------------------
// 通用组件
// ---------------------------------------------------------------------------
function tabbar(active) {
  const tabs = [
    { id: 'board', icon: '🪑', label: '店铺' },
    { id: 'members', icon: '👥', label: '会员' },
    { id: 'revenue', icon: '💰', label: '收入' },
    { id: 'me', icon: '🙋', label: '我的' },
  ];
  return `<nav class="tabbar">${tabs.map((t) => `
    <button class="${active === t.id ? 'active' : ''}" onclick="go('${t.id}')">
      <span class="icon">${t.icon}</span><span>${t.label}</span>
    </button>`).join('')}</nav>`;
}

function topbar(title, backTo) {
  return `<header class="topbar">
    ${backTo ? `<button class="back" onclick="go('${backTo}')">‹ 返回</button>` : '<span class="logo">🧩</span>'}
    <h1>${esc(title)}</h1>
  </header>`;
}

function loadingView(msg = '加载中…') {
  return `<div class="page"><div class="loading"><div class="spinner"></div>${esc(msg)}</div></div>`;
}

// ---------------------------------------------------------------------------
// 登录
// ---------------------------------------------------------------------------
function LoginPage() {
  return `
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div class="mark">🧩</div>
        <h1>请拼豆</h1>
        <p>会员管理系统</p>
      </div>
      <div class="card">
        <div id="login-error"></div>
        <div class="field">
          <label>账号</label>
          <input id="username" autocomplete="username" autocapitalize="off" placeholder="请输入用户名">
        </div>
        <div class="field">
          <label>密码</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <button class="btn" id="login-btn" onclick="doLogin()">登 录</button>
      </div>
    </div>
  </div>`;
}

async function doLogin() {
  const username = $('#username').value.trim();
  const password = $('#password').value;
  const errBox = $('#login-error'), btn = $('#login-btn');

  if (!username || !password) {
    errBox.innerHTML = `<div class="alert error">请输入账号和密码</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await api.post('/api/v1/auth/login', { username, password });
    state.user = r.user;
    go('board');
    toast(`欢迎回来，${r.user.displayName || r.user.username}`);
  } catch (e) {

    btn.disabled = false; btn.textContent = '登 录';
  }
}

function seatCard(t) {
  if (t.status === 'maintenance') {
    return `<div class="seat maintenance">
      <div class="seat-head">
        <span class="seat-name">${esc(t.tableName)}</span>
        <span class="pill fix">维护中</span>
      </div>
      <div class="seat-empty"><span>暂不可用</span></div>
    </div>`;
  }

  if (t.status === 'idle') {
    return `<div class="seat idle" onclick="go('openTable',{tableId:${t.tableId}})">
      <div class="seat-head">
        <span class="seat-name">${esc(t.tableName)}</span>
        <span class="pill free">空闲</span>
      </div>
      <div class="seat-empty">
        <span class="plus">＋</span>
        <span>点击接待顾客</span>
      </div>
    </div>`;
  }

  const s = t.session;
  const isCard = s.usedCard;
  let cls = 'occupied', pillCls = 'busy', pillTxt = '使用中';

  // 暂停优先级最高：暂停中显示「已暂停」，不再进入超时/提醒状态
  if (s.paused) {
    pillCls = 'paused';
    pillTxt = '⏸ 已暂停';
  } else if (isCard) {
    // 用卡核销是全天不限时的通行权益，永远不进入"即将到时/已超时"状态
    pillCls = 'card';
    pillTxt = cardTypeName(s.cardType) + '中';
  } else {
    if (s.alertLevel === 'warning') { cls = 'warning'; pillCls = 'warn'; pillTxt = '即将到时'; }
    if (s.alertLevel === 'overtime') { cls = 'overtime'; pillCls = 'over'; pillTxt = '已超时'; }
  }

  // 时间信息：开始 + 结束（限时套餐）；用卡会话没有结束时间
  const timeRange = s.expectedEndAt
    ? `${fmtTime(s.startedAt)} — ${fmtTime(s.expectedEndAt)}`
    : `${fmtTime(s.startedAt)} 开始`;

  // 卡种会话：显示权益到期日与已玩时长，不显示倒计时
  let timerHtml = '';
  if (s.paused) {
    // 暂停中：倒计时冻结，显示暂停提示
    timerHtml = `<div class="seat-timer">
      <div class="label">${esc(s.productName || '计时')}</div>
      <div class="time small" style="color:#B08A00">⏸ 暂停中 · 恢复后继续计费</div>
    </div>`;
  } else if (isCard) {
    const elapsed = Math.floor((Date.now() - new Date(s.startedAt).getTime()) / 60000);
    timerHtml = `<div class="seat-timer">
      <div class="label">🎫 ${cardTypeName(s.cardType)} · <span style="font-weight:700;color:#0B6B4F">全天不限时</span></div>
      <div class="time small">权益至 ${fmtDate(s.cardExpiresAt)}${s.cardType === 'day' ? '' : '（' + cardDaysLeft(s.cardExpiresAt) + '）'}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px" data-elapsed="${s.startedAt}">已玩 —</div>
    </div>`;
  } else if (s.expectedEndAt) {
    // 限时套餐：倒计时由 JS 每秒本地更新，不需要重新请求接口。
    // 首屏直接算出文本，避免出现一瞬间的占位符。
    const { text, over } = formatCountdown(new Date(s.expectedEndAt).getTime() - Date.now());
    timerHtml = `<div class="seat-timer">
      <div class="label">${esc(s.productName)} · <span class="cd-label">${over ? '已超时' : '剩余'}</span></div>
      <div class="time" data-countdown="${s.expectedEndAt}">${text}</div>
    </div>`;
  } else {
    const elapsed = Math.floor((Date.now() - new Date(s.startedAt).getTime()) / 60000);
    timerHtml = `<div class="seat-timer">
      <div class="label">${esc(s.productName)}</div>
      <div class="time small" data-elapsed="${s.startedAt}">已玩 ${humanMinutes(elapsed)}</div>
    </div>`;
  }

  return `<div class="${cls === 'occupied' ? 'seat occupied' : 'seat ' + cls}"
               data-seat="${s.sessionId}"
               data-state="${cls}"
               data-end="${s.expectedEndAt || ''}"
               onclick="go('seatDetail',{sessionId:${s.sessionId}})">
    <div class="seat-head">
      <span class="seat-name">${esc(t.tableName)}</span>
      <span class="pill ${pillCls}">${pillTxt}</span>
    </div>
    <div class="seat-person">
      <span class="avatar">${s.memberId ? '👤' : '🙋'}</span>
      <span>${esc(s.displayName)}</span>
    </div>
    <div class="seat-meta">🕐 ${timeRange}</div>
    ${timerHtml}
  </div>`;
}

function cardDaysLeft(expiresAt) {
  if (!expiresAt) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(String(expiresAt).slice(0, 10) + 'T00:00:00');
  const days = Math.round((exp - today) / 86400000);
  if (days < 0) return '已过期';
  if (days === 0) return '今天到期';
  return `剩 ${days} 天`;
}

function cardTypeName(t) {
  return { week: '周卡', month: '月卡', day: '日卡' }[t] || '卡';
}

let searchTimer = null;
function debouncedSearchMembers(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchMembers(q), 250);
}

/**
 * 会员列表页的实时搜索。
 * 与开台页不同，这里走路由刷新整页列表，因此：
 *   · 防抖时间略长，避免边打字边发请求
 *   · 已处于同一关键词时不重复跳转
 */
let memberSearchTimer = null;
function debouncedMemberSearch(q) {
  clearTimeout(memberSearchTimer);
  memberSearchTimer = setTimeout(() => {
    const cur = (state.route.params.q || '').trim();
    const next = q.trim();
    if (cur === next) return;
    go('members', { q: next });
  }, 350);
}

async function searchMembers(q) {
  const box = $('#mresults');
  const keyword = q.trim();
  if (!keyword) { box.innerHTML = ''; return; }

  const tableId = state.route.params.tableId;
  const d = await api.get(`/api/v1/members?limit=8&q=${encodeURIComponent(keyword)}`);

  if (d.members.length === 0) {
    // 搜不到就直接给开卡入口，不必跳去会员页再绕回来。
    // 把刚输入的关键字带过去，省得重打一遍。
    const isTail = /^\d{4}$/.test(keyword);
    box.innerHTML = `
      <div class="alert warn" style="margin-bottom:10px">
        没有找到「${esc(keyword)}」这个会员
      </div>
      <button class="btn" onclick="go('newMember',{from:'openTable',tableId:${tableId},tableName:'${esc(state.route.params.tableName || '')}',nickname:'${isTail ? '' : esc(keyword)}',phoneTail:'${isTail ? keyword : ''}'})">
        ＋ 给「${esc(keyword)}」开卡
      </button>`;
    return;
  }

  box.innerHTML = `<div class="list">${d.members.map((m) => `
    <div class="list-item" onclick="pickMember(${tableId},${m.id})">
      <div class="main">
        <div class="name">${esc(m.displayName)}</div>
        <div class="meta">${esc(m.memberNo)}${m.cardValid ? ' · ' + cardTypeName(m.cardType) + '有效' : ''}</div>
      </div>
      <div class="meta">›</div>
    </div>`).join('')}</div>`;
}

function pickMember(tableId, memberId) {
  go('openTable', { tableId, memberId, step: 'product' });
}

function pickGuest(tableId) {
  const name = $('#guestName').value.trim();
  if (!name) { toast('请填写散客称呼', 'error'); return; }
  if (name.length > 20) { toast('称呼不能超过 20 个字', 'error'); return; }

/**
 * 开台。
 * 只接收 productId，其余（桌位、会员、散客称呼）从 state.openTarget 读取。
 * 这样避免把用户输入的称呼拼进 onclick —— 那会破坏 JS 语法并造成注入风险。
 */
async function openWithProduct(productId) {
  const errBox = $('#ot-error');
  const target = state.openTarget;
  if (!target) {
    if (errBox) errBox.innerHTML = `<div class="alert error">页面状态已失效，请返回重新选择桌位</div>`;
    return;
  }

  // 二次确认：套餐一点就开台，选错只能整单作废，高峰期容易出错
  const products = await api.get('/api/v1/products');
  const prod = products.products.find((p) => p.id === productId);

  // 找不到套餐通常有两个原因，都要给店员一条明确的出路：
  //   1. 管理员刚刚下架了这个套餐，而页面上的列表还是旧的
  //   2. 页面状态过期
  // 只说"套餐不存在"等于把店员晾在原地，因此这里刷新列表并说明原因。
  if (!prod) {
    if (errBox) {
      errBox.innerHTML = `<div class="alert error">
        这个套餐刚刚被下架或已停用，请重新选择。<br>
        <span style="font-size:12.5px">下面列出的是当前在售的套餐。</span>
      </div>`;
    }
    // 重新渲染页面，让套餐列表刷新到最新
    render();
    window.scrollTo(0, 0);
    return;
  }

  const who = target.guestName ? `散客：${target.guestName}` : '会员（已选择）';

  // 说明文字必须按套餐类型区分：
  // 限时套餐按分钟计费并计超时；限板与日卡不限时，既不倒计时也不收超时费。
  let note;
  if (prod.category === 'timed') {
    note = '开台后立即开始计时。结账时按实际时长计费，' +
           '超出套餐时长每满 20 分钟加收 ¥5。';
  } else if (prod.category === 'board') {
    note = `这款按钉数计费，不限时。不计倒计时，也不会产生超时费。`;
  } else if (prod.category === 'day') {
    note = '日卡当天有效，不限时。不计倒计时，也不会产生超时费。';
  } else {
    note = '开台后立即生效。';
  }

  state.confirmDialog = {
    title: '确认开台',
    lines: [
      who,
      `套餐：${prod.name}　¥${yuan(prod.priceCents)}`,
      prod.durationMinutes ? `时长：${humanMinutes(prod.durationMinutes)}`
        : (prod.pins ? `钉数：${prod.pins} 钉（不限时）`
        : (prod.cardValidDays ? `有效期：${prod.cardValidDays} 天` : '')),
    ].filter(Boolean),
    note,
    confirmText: '确认开台',
    confirmFn: 'reallyOpenWithProduct',
    args: [productId],
  };
  render();
}

/** 已确认后真正执行开台 */
async function reallyOpenWithProduct(productId) {
  const errBox = $('#ot-error');
  const target = state.openTarget;
  if (!target) return;

  try {
    const r = await api.post('/api/v1/sessions', {
      tableId: target.tableId,
      memberId: target.memberId,
      guestName: target.guestName,
      productId,
    });
    state.openTarget = null;
    toast(`${r.tableName} 开台成功 · ${r.productName}`);
    go('seatDetail', { sessionId: r.sessionId });
  } catch (e) {
    if (errBox) errBox.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    window.scrollTo(0, 0);
  }
}

/* =========================================================================
   通用确认弹窗
   用于开台、换套餐、桌位维护等"一点就生效"的操作，避免误触。
   ========================================================================= */
function closeConfirmDialog() {
  state.confirmDialog = null;
  render();
}

function confirmDialogHtml() {
  const dlg = state.confirmDialog;
  if (!dlg) return '';
  return `
  <div class="card-dialog-mask" onclick="closeConfirmDialog()"></div>
  <div class="card-dialog">
    <div class="cd-title">${esc(dlg.title)}</div>
    ${dlg.lines && dlg.lines.length ? `<div class="cd-info">
      ${dlg.lines.map((l) => esc(l)).join('<br>')}
    </div>` : ''}
    ${dlg.totalText ? `<div class="confirm-total">${esc(dlg.totalText)}</div>` : ''}
    ${dlg.note ? `<div class="confirm-note">${esc(dlg.note)}</div>` : ''}
    <div class="btn-group">
      <button class="btn" onclick="runConfirmAction()">${esc(dlg.confirmText || '确认')}</button>
      <button class="btn secondary" onclick="closeConfirmDialog()">取消</button>
    </div>
  </div>`;
}

/** 执行确认弹窗里挂载的动作 */
async function runConfirmAction() {
  const dlg = state.confirmDialog;
  if (!dlg) return;
  const fnName = dlg.confirmFn;
  const args = dlg.args ?? [];
  const fn = window[fnName];
  state.confirmDialog = null;
  render();
  if (typeof fn === 'function') await fn(...args);
}

/**
 * 用卡开台。
 *
 * 卡权益（周卡/月卡/日卡）是"全天不限时的通行权"，因此：
 *   · 不需要选择套餐
 *   · 不设结束时间，也就不会产生超时费
 * 这里只传 useCard，由后端记录权益到期日并释放套餐字段。
 */
async function openWithCard(tableId, memberId) {
  const errBox = $('#ot-error');
  try {
    const r = await api.post('/api/v1/sessions', {
      tableId, memberId, useCard: true, productId: null,
    });
    toast(`${r.tableName} 用卡开台成功 · 权益至 ${fmtDate(r.cardExpiresAt)}`);
    go('seatDetail', { sessionId: r.sessionId });
  } catch (e) {
    if (errBox) errBox.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    window.scrollTo(0, 0);
  }
}
